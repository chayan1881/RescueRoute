<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueRoute - Emergency Vehicle Route Optimizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 75vh; width: 100%; border-radius: 8px; }
        .sidebar { background: #f8f9fa; padding: 20px; border-radius: 8px; height: 75vh; overflow-y: auto; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-danger mb-4 shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 font-weight-bold">🚨 RescueRoute: Emergency Optimizer</span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-4">
                <div class="sidebar shadow-sm">
                    <h4>Control Panel</h4>
                    <p class="text-muted small">Select parameters and execute pathfinding algorithms.</p>
                    
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Start Location</label>
                        <select id="startNode" class="form-select">
                            <option value="Hospital">Hospital</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Incident Destination</label>
                        <select id="goalNode" class="form-select">
                            <option value="Accident_Site">Accident Site</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Algorithm Choice</label>
                        <select id="algoChoice" class="form-select">
                            <option value="astar">A* Search (Heuristic)</option>
                            <option value="dijkstra">Dijkstra's Algorithm</option>
                        </select>
                    </div>

                    <button onclick="calculateRoute()" class="btn btn-danger w-100 mb-3 shadow-sm">Run Optimization</button>

                    <div id="metricsCard" class="card mt-3 d-none border-success">
                        <div class="card-body">
                            <h5 class="card-title text-success">Performance Metrics</h5>
                            <p class="mb-1"><strong>Algorithm:</strong> <span id="algoUsed">-</span></p>
                            <p class="mb-1"><strong>Total Weight/Cost:</strong> <span id="totalCost">0</span></p>
                            <p class="mb-1"><strong>Nodes Explored:</strong> <span id="nodesExplored">0</span></p>
                            <p class="mb-0"><strong>Path:</strong> <span id="pathTaken">-</span></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div id="map" class="shadow-sm"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([3.5, 3.5], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let routeLayer = null;

        async function calculateRoute() {
            const start = document.getElementById('startNode').value;
            const goal = document.getElementById('goalNode').value;
            const algorithm = document.getElementById('algoChoice').value;

            try {
                const response = await fetch('http://127.0.0.1:5000/api/optimize-route', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ start, goal, algorithm })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('algoUsed').innerText = data.algorithm_used;
                    document.getElementById('totalCost').innerText = data.total_cost;
                    document.getElementById('nodesExplored').innerText = data.nodes_explored;
                    document.getElementById('pathTaken').innerText = data.path.join(' ➔ ');
                    document.getElementById('metricsCard').classList.remove('d-none');

                    if (routeLayer) map.removeLayer(routeLayer);
                    
                    const latLngs = data.coordinates.map(coord => [coord[1], coord[0]]);
                    routeLayer = L.polyline(latLngs, { color: algorithm === 'astar' ? 'blue' : 'orange', weight: 5 }).addTo(map);
                    map.fitBounds(routeLayer.getBounds());
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                console.error(err);
                alert('Could not connect to Flask backend.');
            }
        }
    </script>
</body>
</html>
